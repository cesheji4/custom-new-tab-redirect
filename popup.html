<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        :root {
            --bg-color: #fafafa;
            --text-color: #333333;
            --muted-color: #666666;
            --border-color: #cccccc;
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --success-color: #28a745;
            --secondary-hover: #e9ecef;
            --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            font-family: var(--font-family);
            padding: 16px 18px;
            width: 480px;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            box-sizing: border-box;
        }

        h3 {
            margin-top: 0;
            margin-bottom: 12px;
            color: var(--text-color);
            font-size: 15px;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 10px;
        }

        .input-wrapper input {
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 0;
            padding: 8px 30px 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 13px;
            background-color: #ffffff;
            color: var(--text-color);
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25);
        }

        .clear-btn {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 2px 6px;
            font-size: 16px;
            color: var(--muted-color);
            border-radius: 50%;
            display: none;
            line-height: 1;
            user-select: none;
        }

        .clear-btn:hover {
            color: var(--text-color);
            background-color: var(--secondary-hover);
        }

        .primary-btn {
            width: 100%;
            padding: 8px 12px;
            cursor: pointer;
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            transition: background-color 0.15s ease;
        }

        .primary-btn:hover {
            background-color: var(--primary-hover);
        }

        .status {
            color: var(--success-color);
            display: none;
            margin-top: 8px;
            font-size: 12px;
            text-align: center;
        }

        .homepage-container {
            margin-top: 10px;
            text-align: center;
        }

        .homepage-link {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 12px;
            display: inline-block;
        }

        .homepage-link:hover {
            text-decoration: underline;
            color: var(--primary-hover);
        }
    </style>
</head>
<body>
    <h3>Set New Tab URL</h3>
    <div class="input-wrapper">
        <input type="url" id="linkInput" placeholder="https://example.com" />
        <button type="button" id="clearBtn" class="clear-btn" title="Clear input" aria-label="Clear input">&times;</button>
    </div>
    <button id="saveBtn" class="primary-btn">Save URL</button>
    <div id="status" class="status">Saved successfully!</div>

    <div class="homepage-container">
        <a href="https://chromewebstore.google.com/detail/custom-new-tab-redirect/phenpbfhfgcghknjgmdlkekpigfaaobe" target="_blank" rel="noopener noreferrer" class="homepage-link">Custom New Tab Redirect Homepage</a>
    </div>

    <script type="module" src="popup.js"></script>
</body>
</html>
