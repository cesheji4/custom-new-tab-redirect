<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>New Tab</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-primary: #202124;
            --text-secondary: #5f6368;
            --border-color: #dadce0;
            --button-primary-bg: #1a73e8;
            --button-primary-hover: #1557b0;
            --success-color: #28a745;
            --card-shadow: 0 2px 10px rgba(0, 0, 0, 0.08);
            --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            font-family: var(--font-family);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-primary);
        }

        .container {
            text-align: center;
            padding: 36px 32px;
            border-radius: 12px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            box-shadow: var(--card-shadow);
            max-width: 540px;
            width: 90%;
            box-sizing: border-box;
        }

        .form-title {
            margin-top: 0;
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 16px;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 12px;
        }

        .input-wrapper input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 32px 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            background-color: #ffffff;
            color: var(--text-primary);
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--button-primary-bg);
            box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.25);
        }

        .clear-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 2px 6px;
            font-size: 18px;
            color: var(--text-secondary);
            border-radius: 50%;
            display: none;
            line-height: 1;
            user-select: none;
        }

        .clear-btn:hover {
            color: var(--text-primary);
            background-color: #f1f3f4;
        }

        .primary-btn {
            width: 100%;
            padding: 10px 16px;
            cursor: pointer;
            background-color: var(--button-primary-bg);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.15s ease;
        }

        .primary-btn:hover {
            background-color: var(--button-primary-hover);
        }

        .status {
            display: none;
            margin-top: 10px;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="noLinkContainer" class="container" style="display: none;">
        <h2 class="form-title">Set New Tab URL</h2>
        <div class="input-wrapper">
            <input type="url" id="homeLinkInput" placeholder="https://example.com" />
            <button type="button" id="homeClearBtn" class="clear-btn" title="Clear input" aria-label="Clear input">&times;</button>
        </div>
        <button id="homeSaveBtn" class="primary-btn">Save URL</button>
        <div id="homeStatus" class="status"></div>
    </div>

    <script type="module" src="homepage.js"></script>
</body>
</html>
